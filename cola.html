<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Panel de música - Mate & Café</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Karla:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --fondo: #f2ede6;
      --papel: #fdfbf7;
      --verde: #1a3e24;
      --verde-boton: #3b5e2b;
      --verde-claro: #e6eedf;
      --marron: #85705a;
      --texto: #2b2420;
      --gris: #6b5a4e;
      --borde: #dcd2c4;
      --rojo: #a23b2a;
      --rojo-claro: #fbe9e5;
      --spotify: #1db954;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--fondo);
      color: var(--texto);
      font-family: 'Karla', system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.45;
    }
    .oculto { display: none !important; }
    .contenedor { max-width: 640px; margin: 0 auto; padding: 20px 16px 48px; }
 
    h1, h2 { font-family: 'Fraunces', Georgia, serif; color: var(--verde); margin: 0; }
    h1 { font-size: 1.6rem; }
    h2 { font-size: 1.15rem; margin: 28px 0 10px; }
 
    /* Login */
    .login {
      background: var(--papel);
      border: 1px solid var(--borde);
      border-radius: 18px;
      padding: 24px 20px;
      margin-top: 10vh;
      display: flex; flex-direction: column; gap: 14px;
    }
    label { font-size: 0.8rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--marron); }
    input {
      width: 100%; font: inherit; color: var(--texto);
      background: #fff; border: 1.5px solid var(--borde); border-radius: 12px;
      padding: 12px 14px; min-height: 48px; margin-top: 6px;
    }
    input:focus { outline: none; border-color: var(--verde-boton); }
 
    button, .boton {
      font: inherit; font-weight: 700; cursor: pointer;
      border: none; border-radius: 999px; padding: 10px 16px; min-height: 44px;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      text-decoration: none; white-space: nowrap;
    }
    .principal { background: var(--verde-boton); color: #fff; }
    .spotify { background: var(--spotify); color: #fff; }
    .secundario { background: transparent; color: var(--gris); border: 1.5px solid var(--borde); }
    .peligro { background: transparent; color: var(--rojo); border: 1.5px solid #e9c3bb; }
    button:disabled { opacity: 0.6; cursor: wait; }
 
    .error { background: var(--rojo-claro); color: var(--rojo); border-radius: 12px; padding: 10px 14px; font-weight: 600; }
 
    /* Encabezado del panel */
    .barra { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .barra .acciones { display: flex; gap: 8px; }
    .estado-linea { color: var(--gris); font-size: 0.85rem; margin-top: 4px; }
 
    /* Tarjetas de pedidos */
    .lista { display: flex; flex-direction: column; gap: 10px; }
    .pedido {
      background: var(--papel); border: 1px solid var(--borde); border-radius: 16px;
      padding: 14px 16px; display: flex; flex-direction: column; gap: 10px;
    }
    .pedido .tema { font-weight: 700; font-size: 1.05rem; word-break: break-word; }
    .pedido .meta { color: var(--gris); font-size: 0.85rem; }
    .pedido .botones { display: flex; gap: 8px; flex-wrap: wrap; }
    .pedido .botones .spotify { flex: 1; }
    .chip {
      display: inline-block; font-size: 0.75rem; font-weight: 700; border-radius: 999px;
      padding: 2px 8px; margin-left: 6px; vertical-align: middle;
    }
    .chip.agregada { background: var(--verde-claro); color: var(--verde); }
    .chip.descartada { background: var(--rojo-claro); color: var(--rojo); }
    .historial .pedido { padding: 10px 14px; flex-direction: row; align-items: center; justify-content: space-between; }
    .historial .tema { font-size: 0.95rem; }
    .vacio { background: var(--papel); border: 1.5px dashed var(--borde); border-radius: 16px; padding: 22px; text-align: center; color: var(--gris); }
  </style>
</head>
<body>
  <main class="contenedor">
 
    <!-- Pantalla de login -->
    <section id="pantallaLogin" class="oculto">
      <form id="formLogin" class="login">
        <h1>Panel de música</h1>
        <div>
          <label for="email">Email</label>
          <input type="email" id="email" autocomplete="username" required>
        </div>
        <div>
          <label for="password">Contraseña</label>
          <input type="password" id="password" autocomplete="current-password" required>
        </div>
        <div id="errorLogin" class="error oculto"></div>
        <button type="submit" id="btnLogin" class="principal">Entrar</button>
      </form>
    </section>
 
    <!-- Panel -->
    <section id="pantallaPanel" class="oculto">
      <div class="barra">
        <div>
          <h1>Cola de temas</h1>
          <div class="estado-linea" id="estadoLinea">Cargando…</div>
        </div>
        <div class="acciones">
          <button class="secundario" id="btnRefrescar" title="Actualizar">↻ Actualizar</button>
          <button class="secundario" id="btnSalir">Salir</button>
        </div>
      </div>
 
      <div id="errorPanel" class="error oculto" style="margin-top:14px"></div>
 
      <h2>Pendientes <span id="contadorPendientes"></span></h2>
      <div id="listaPendientes" class="lista"></div>
 
      <h2>Últimos atendidos</h2>
      <div id="listaHistorial" class="lista historial"></div>
    </section>
 
  </main>
 
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script>
    const SUPABASE_URL = 'https://jeahmnkumhuihxvliouo.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_FV3iFcEz5o0XtTBo2qohtA__WIsKkhU';
    const ACTUALIZAR_CADA_MS = 30000; // busca pedidos nuevos cada 30 segundos
 
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const $ = (id) => document.getElementById(id);
    let temporizador = null;
 
    // ---------- Utilidades ----------
    function esLinkSpotify(p) {
      return p.link_spotify && p.link_spotify.startsWith('https://open.spotify.com/');
    }
 
    function textoTema(p) {
      if (esLinkSpotify(p) && (!p.titulo || p.titulo === 'Tema desde Spotify')) {
        return 'Tema por link de Spotify';
      }
      return `${p.titulo || '¿?'} — ${p.artista || '¿?'}`;
    }
 
    function urlSpotify(p) {
      if (esLinkSpotify(p)) return p.link_spotify;
      const busqueda = `${p.titulo || ''} ${p.artista || ''}`.trim();
      return 'https://open.spotify.com/search/' + encodeURIComponent(busqueda);
    }
 
    function hace(fecha) {
      const min = Math.round((Date.now() - new Date(fecha).getTime()) / 60000);
      if (min < 1) return 'recién';
      if (min < 60) return `hace ${min} min`;
      const h = Math.round(min / 60);
      if (h < 24) return `hace ${h} h`;
      return new Date(fecha).toLocaleDateString('es-AR', { day: 'numeric', month: 'short' });
    }
 
    function mostrarError(div, texto) {
      div.textContent = texto;
      div.classList.toggle('oculto', !texto);
    }
 
    // ---------- Login ----------
    $('formLogin').addEventListener('submit', async (e) => {
      e.preventDefault();
      mostrarError($('errorLogin'), '');
      $('btnLogin').disabled = true;
      $('btnLogin').textContent = 'Entrando…';
 
      const { error } = await db.auth.signInWithPassword({
        email: $('email').value.trim(),
        password: $('password').value
      });
 
      $('btnLogin').disabled = false;
      $('btnLogin').textContent = 'Entrar';
      if (error) {
        mostrarError($('errorLogin'), 'Email o contraseña incorrectos.');
      }
    });
 
    $('btnSalir').addEventListener('click', async () => {
      await db.auth.signOut();
    });
 
    // Cambia de pantalla según haya sesión o no (la sesión queda guardada en el navegador)
    db.auth.onAuthStateChange((_evento, sesion) => {
      const logueado = Boolean(sesion);
      $('pantallaLogin').classList.toggle('oculto', logueado);
      $('pantallaPanel').classList.toggle('oculto', !logueado);
      clearInterval(temporizador);
      if (logueado) {
        cargar();
        temporizador = setInterval(cargar, ACTUALIZAR_CADA_MS);
      }
    });
 
    // ---------- Cargar pedidos ----------
    async function cargar() {
      const [pend, hist] = await Promise.all([
        db.from('pedidos').select('*').eq('estado', 'pendiente').order('creado_en', { ascending: true }),
        db.from('pedidos').select('*').neq('estado', 'pendiente').order('id', { ascending: false }).limit(15)
      ]);
 
      if (pend.error || hist.error) {
        mostrarError($('errorPanel'), 'No se pudieron cargar los pedidos. ¿Tu usuario tiene permiso?');
        return;
      }
      mostrarError($('errorPanel'), '');
      dibujarPendientes(pend.data);
      dibujarHistorial(hist.data);
      $('estadoLinea').textContent = 'Actualizado ' + new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
    }
 
    function dibujarPendientes(pedidos) {
      const lista = $('listaPendientes');
      lista.innerHTML = '';
      $('contadorPendientes').textContent = pedidos.length ? `(${pedidos.length})` : '';
 
      if (!pedidos.length) {
        lista.innerHTML = '<div class="vacio">No hay temas pendientes ☕</div>';
        return;
      }
 
      for (const p of pedidos) {
        const tarjeta = document.createElement('div');
        tarjeta.className = 'pedido';
 
        const tema = document.createElement('div');
        tema.className = 'tema';
        tema.textContent = textoTema(p);
 
        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.textContent = `${p.nombre_cliente || 'Sin nombre'} · código ${p.codigo} · ${hace(p.creado_en)}`;
 
        const botones = document.createElement('div');
        botones.className = 'botones';
 
        // Es un link real: abre Spotify sin que el navegador lo bloquee,
        // y al mismo tiempo marca el pedido como agregado.
        const abrir = document.createElement('a');
        abrir.className = 'boton spotify';
        abrir.href = urlSpotify(p);
        abrir.target = '_blank';
        abrir.rel = 'noopener';
        abrir.textContent = esLinkSpotify(p) ? '▶ Abrir en Spotify' : '🔎 Buscar en Spotify';
        abrir.addEventListener('click', () => cambiarEstado(p.id, 'agregada'));
 
        const descartar = document.createElement('button');
        descartar.className = 'peligro';
        descartar.textContent = 'Descartar';
        descartar.addEventListener('click', () => {
          if (confirm(`¿Descartar "${textoTema(p)}"?`)) cambiarEstado(p.id, 'descartada');
        });
 
        botones.append(abrir, descartar);
        tarjeta.append(tema, meta, botones);
        lista.append(tarjeta);
      }
    }
 
    function dibujarHistorial(pedidos) {
      const lista = $('listaHistorial');
      lista.innerHTML = '';
 
      if (!pedidos.length) {
        lista.innerHTML = '<div class="vacio">Todavía no atendiste ningún tema.</div>';
        return;
      }
 
      for (const p of pedidos) {
        const fila = document.createElement('div');
        fila.className = 'pedido';
 
        const info = document.createElement('div');
        const tema = document.createElement('div');
        tema.className = 'tema';
        tema.textContent = textoTema(p);
        const chip = document.createElement('span');
        chip.className = 'chip ' + p.estado;
        chip.textContent = p.estado === 'agregada' ? 'Agregada' : 'Descartada';
        tema.append(chip);
        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.textContent = p.nombre_cliente || 'Sin nombre';
        info.append(tema, meta);
 
        const volver = document.createElement('button');
        volver.className = 'secundario';
        volver.textContent = '↩ Pendiente';
        volver.addEventListener('click', () => cambiarEstado(p.id, 'pendiente'));
 
        fila.append(info, volver);
        lista.append(fila);
      }
    }
 
    // ---------- Cambiar estado ----------
    async function cambiarEstado(id, estado) {
      const { error } = await db.from('pedidos').update({ estado }).eq('id', id);
      if (error) {
        mostrarError($('errorPanel'), 'No se pudo actualizar el tema. Probá de nuevo.');
        return;
      }
      cargar();
    }
 
    $('btnRefrescar').addEventListener('click', cargar);
  </script>
</body>
</html>
